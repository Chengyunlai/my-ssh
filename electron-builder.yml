appId: com.example.myssh
productName: MySSH
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  target:
    - dmg
    - zip # electron-updater 在 macOS 只认 zip 产物(dmg 仅供手动安装)
dmg:
  # 磁盘卷不会像 .app 那样自动套 macOS 圆角,使用专用圆角卷图标。
  icon: build/dmg-volume.icns
win:
  icon: build/icon.ico
  target:
    - nsis
linux:
  category: Network
  icon: build/icons
  target:
    - AppImage
publish:
  provider: github
  owner: Chengyunlai
  repo: my-ssh
  releaseType: release
npmRebuild: false
