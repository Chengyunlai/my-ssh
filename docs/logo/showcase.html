<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background: #FAFAFA;
            color: #1A1A1A;
            overflow-x: hidden;
        }

        .font-mono { font-family: 'JetBrains Mono', 'Courier New', monospace; }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");
            pointer-events: none; z-index: 9999;
        }

        html { scroll-behavior: smooth; }

        .logo-card { transition: all 0.7s cubic-bezier(0.16, 1, 0.3, 1); }
        .logo-card:hover { transform: translateY(-4px); }
        .logo-canvas { position: relative; transition: transform 0.7s cubic-bezier(0.16, 1, 0.3, 1); }

        .logo-aura {
            position: absolute; inset: 0;
            background: radial-gradient(circle, rgba(255,255,255,0.4) 0%, transparent 70%);
            border-radius: 50%; transform: scale(0.5); opacity: 0;
            transition: all 1s cubic-bezier(0.16, 1, 0.3, 1);
            filter: blur(40px); pointer-events: none;
        }
        .logo-card:hover .logo-aura { transform: scale(1); opacity: 1; }

        .divider-line { width: 0; height: 1px; background: #1A1A1A; opacity: 0.2; transition: width 0.7s cubic-bezier(0.16, 1, 0.3, 1); }
        .logo-card:hover .divider-line { width: 100%; }

        .tracking-ultra-wide { letter-spacing: 0.2em; }
        .text-balance { text-wrap: balance; }

        .dl-link {
            opacity: 0; transform: translateY(6px);
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .logo-card:hover .dl-link { opacity: 1; transform: translateY(0); }

        /* Subtle logo animations (web display only) */
        @keyframes blink { 0%, 55% { opacity: 0.9; } 56%, 100% { opacity: 0.12; } }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.45; transform: scale(0.8); }
        }
        @keyframes breathe { 0%, 100% { opacity: 0.75; } 50% { opacity: 1; } }
        @keyframes fan-in { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

        .anim-blink { animation: blink 1.6s steps(1) infinite; }
        .anim-pulse-dot { animation: pulse-dot 2.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
        .anim-breathe { animation: breathe 4s ease-in-out infinite; }
        .anim-fan { animation: fan-in 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    </style>
</head>
<body>
