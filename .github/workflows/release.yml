name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # 手动触发:按当前 package.json 版本构建发布

permissions:
  contents: write # 允许创建 GitHub Release 并上传产物

jobs:
  release:
    name: Build & Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac
          - os: windows-latest
            target: win
          - os: ubuntu-latest
            target: linux
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # CI 上无签名证书:跳过 macOS 代码签名 / notarization
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Package & Publish to GitHub Releases
        run: npx electron-builder --publish always --${{ matrix.target }}
