name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # 手动触发:按当前 package.json 版本构建发布

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: write # 仅发布 job 可创建 GitHub Release 并上传产物
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac
          - os: windows-latest
            target: win
          - os: ubuntu-latest
            target: linux
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # CI 上无签名证书:跳过 macOS 代码签名 / notarization
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Rebuild macOS icon assets (100% opaque)
        if: matrix.os == 'macos-latest'
        run: node scripts/prepare-macos-icon.mjs

      - name: Package & Publish to GitHub Releases
        run: npx electron-builder --publish always --${{ matrix.target }}
