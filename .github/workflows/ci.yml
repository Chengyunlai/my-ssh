name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-platform:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Create disposable real WSL distribution
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/setup-ci-wsl.ps1

      - name: Real WSL terminal handoff
        if: runner.os == 'Windows'
        run: python scripts/verify-wsl.py node

      - name: TUI entrypoint smoke
        run: node out/tui/myssh.cjs --help

      - name: Verify independent TUI package
        run: npm run verify:tui-package

      - name: TUI PTY interaction
        run: node scripts/verify-tui.mjs

      - name: Terminal plugin market and database interaction
        run: node scripts/verify-tui-plugins.mjs

      - name: Install real fullscreen terminal fixtures
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y vim tmux

      - name: Real SSH Vim and tmux interaction
        if: runner.os == 'Linux'
        run: node scripts/verify-tui-terminal.mjs

      - name: Single executable without Node on PATH
        run: npm run verify:tui-portable
        env:
          MYSSH_VERIFY_REAL_TERMINAL: ${{ runner.os == 'Linux' && '1' || '0' }}

      - name: Block high or critical production vulnerabilities
        run: npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org

      - name: Remove only the CI-owned WSL distribution
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/cleanup-ci-wsl.ps1

  verify-mysql:
    name: Real MySQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: myssh-test-only
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -pmyssh-test-only"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:tui
      - name: Real database CRUD and safety
        run: node scripts/verify-mysql-real.mjs
        env:
          MYSSH_TEST_MYSQL_PORT: '3306'
          MYSSH_TEST_MYSQL_PASSWORD: myssh-test-only

  verify:
    name: Lint, Typecheck, Test & Build
    if: always()
    needs: [verify-platform, verify-mysql]
    runs-on: ubuntu-latest
    steps:
      - name: Require every platform to pass
        env:
          VERIFY_RESULT: ${{ needs.verify-platform.result }}
          MYSQL_RESULT: ${{ needs.verify-mysql.result }}
        run: test "$VERIFY_RESULT" = success && test "$MYSQL_RESULT" = success
