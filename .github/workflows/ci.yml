name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-platform:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: TUI entrypoint smoke
        run: node out/tui/myssh.cjs --help

      - name: Verify independent TUI package
        run: npm run verify:tui-package

      - name: TUI PTY interaction
        run: node scripts/verify-tui.mjs

      - name: Single executable without Node on PATH
        run: npm run verify:tui-portable

      - name: Block high or critical production vulnerabilities
        run: npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org

  verify:
    name: Lint, Typecheck, Test & Build
    if: always()
    needs: verify-platform
    runs-on: ubuntu-latest
    steps:
      - name: Require every platform to pass
        env:
          VERIFY_RESULT: ${{ needs.verify-platform.result }}
        run: test "$VERIFY_RESULT" = success
